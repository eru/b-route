[project]
name = "b-route"
version = "0.1.0"
description = ""
authors = [{ name = "Kazuki Hashimoto", email = "eru.tndl@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5,<4.0",
]

[project.scripts]
sensor = "b_route.sensor:main"

[dependency-groups]
dev = [
    "mypy>=1.6.1,<2.0",
    "ruff>=0.1.3,<0.2.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_errors = false
ignore_missing_imports = true
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

[tool.pyright]
pythonVersion = 3.11

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
